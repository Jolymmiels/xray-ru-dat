name: Build GeoIP for Russia
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 2"  # Weekly on Tuesday at 6:00 UTC (MaxMind publishes updates on Tuesdays)
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-russian-geoip.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAXMIND_COUNTRY_URL: https://github.com/Loyalsoldier/geoip/raw/release/GeoLite2-Country-CSV.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check MaxMind dataset freshness
        id: check-update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEADERS=$(curl -sI "$MAXMIND_COUNTRY_URL")
          LAST_MODIFIED=$(echo "$HEADERS" | grep -i '^last-modified:' | cut -d: -f2- | xargs || true)
          if [ -z "$LAST_MODIFIED" ]; then
            echo "Unable to determine MaxMind dataset timestamp"
            exit 1
          fi
          MAXMIND_DATE=$(date -u -d "$LAST_MODIFIED" +%Y%m%d)
          echo "MaxMind release date: $MAXMIND_DATE"
          echo "maxmind_date=$MAXMIND_DATE" >> $GITHUB_OUTPUT
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/maxmind-$MAXMIND_DATE")
          if [ "$STATUS" = "200" ]; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "No new MaxMind dataset available, skipping build"
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip build (dataset already released)
        if: steps.check-update.outputs.release_exists == 'true'
        run: |
          echo "Release maxmind-${{ steps.check-update.outputs.maxmind_date }} already exists. Skipping remaining steps."

      - name: Set release metadata
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          DATE="${{ steps.check-update.outputs.maxmind_date }}"
          echo "RELEASE_NAME=MaxMind GeoIP ${DATE}" >> $GITHUB_ENV
          echo "TAG_NAME=maxmind-${DATE}" >> $GITHUB_ENV

      - name: Setup Go
        if: steps.check-update.outputs.release_exists == 'false'
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install dependencies
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip jq python3-pip
          pip3 install ipaddress requests

      - name: Create workspace directory
        if: steps.check-update.outputs.release_exists == 'false'
        run: mkdir -p workspace && cd workspace

      - name: Download MaxMind GeoLite2 Country data
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace
          wget -O GeoLite2-Country-CSV.zip "$MAXMIND_COUNTRY_URL"
          unzip -q GeoLite2-Country-CSV.zip
          ls -la
          # Remove zip file to avoid confusion
          rm GeoLite2-Country-CSV.zip

      - name: Extract Russian IPs from MaxMind data
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace
          python3 << 'EOF'
          import csv
          import ipaddress
          import os
          import glob

          # Find MaxMind directory (it's extracted from zip)
          maxmind_dir = None
          for item in os.listdir('.'):
              if os.path.isdir(item) and 'GeoLite2-Country-CSV' in item:
                  maxmind_dir = item
                  break

          if not maxmind_dir:
              print("MaxMind directory not found")
              print("Available files and directories:")
              for item in os.listdir('.'):
                  print(f"  {item} ({'dir' if os.path.isdir(item) else 'file'})")
              exit(1)

          print(f"Processing MaxMind data from: {maxmind_dir}")
          print(f"Directory contents: {os.listdir(maxmind_dir)}")

          # Read country locations to find Russia's geoname_id
          russia_ids = set()
          with open(f'{maxmind_dir}/GeoLite2-Country-Locations-en.csv', 'r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row['country_iso_code'] == 'RU':
                      russia_ids.add(row['geoname_id'])

          print(f"Found Russia geoname_ids: {russia_ids}")

          # Extract Russian IP blocks
          ipv4_blocks = []
          ipv6_blocks = []

          with open(f'{maxmind_dir}/GeoLite2-Country-Blocks-IPv4.csv', 'r') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row['geoname_id'] in russia_ids:
                      ipv4_blocks.append(row['network'])

          with open(f'{maxmind_dir}/GeoLite2-Country-Blocks-IPv6.csv', 'r') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row['geoname_id'] in russia_ids:
                      ipv6_blocks.append(row['network'])

          # Write results
          with open('maxmind-ru-ipv4.txt', 'w') as f:
              for block in sorted(ipv4_blocks):
                  f.write(f"{block}\n")

          with open('maxmind-ru-ipv6.txt', 'w') as f:
              for block in sorted(ipv6_blocks):
                  f.write(f"{block}\n")

          print(f"Extracted {len(ipv4_blocks)} IPv4 blocks and {len(ipv6_blocks)} IPv6 blocks from MaxMind")
          EOF

      - name: Merge and deduplicate Russian IP ranges
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace
          python3 << 'EOF'
          import ipaddress
          from collections import defaultdict

          def read_ip_ranges(filename):
              ranges = []
              try:
                  with open(filename, 'r') as f:
                      for line in f:
                          line = line.strip()
                          if line and not line.startswith('#'):
                              try:
                                  # Handle different formats
                                  if '/' in line:
                                      ranges.append(ipaddress.ip_network(line, strict=False))
                                  elif '-' in line:
                                      # Convert range to CIDR
                                      start, end = line.split('-')
                                      start_ip = ipaddress.ip_address(start.strip())
                                      end_ip = ipaddress.ip_address(end.strip())
                                      ranges.extend(ipaddress.summarize_address_range(start_ip, end_ip))
                              except Exception as e:
                                  print(f"Error processing line '{line}': {e}")
              except FileNotFoundError:
                  print(f"File {filename} not found, skipping")
              return ranges

          # Collect all IPv4 ranges
          ipv4_ranges = []
          ipv4_ranges.extend(read_ip_ranges('maxmind-ru-ipv4.txt'))

          # Collect all IPv6 ranges
          ipv6_ranges = []
          ipv6_ranges.extend(read_ip_ranges('maxmind-ru-ipv6.txt'))

          # Merge and optimize ranges
          def optimize_ranges(ranges):
              if not ranges:
                  return []
              # Sort ranges and merge overlapping ones
              ranges = sorted(set(ranges))
              merged = [ranges[0]]
              for current in ranges[1:]:
                  last = merged[-1]
                  try:
                      # Check if ranges can be merged
                      if (current.network_address <= last.broadcast_address + 1 and
                          current.version == last.version):
                          # Merge ranges
                          start = min(last.network_address, current.network_address)
                          end = max(last.broadcast_address, current.broadcast_address)
                          merged_ranges = list(ipaddress.summarize_address_range(start, end))
                          merged[-1:] = merged_ranges
                      else:
                          merged.append(current)
                  except:
                      merged.append(current)
              return merged

          optimized_ipv4 = optimize_ranges(ipv4_ranges)
          optimized_ipv6 = optimize_ranges(ipv6_ranges)

          # Write final results
          with open('russian-ipv4-final.txt', 'w') as f:
              for network in optimized_ipv4:
                  f.write(f"{network}\n")

          with open('russian-ipv6-final.txt', 'w') as f:
              for network in optimized_ipv6:
                  f.write(f"{network}\n")

          print(f"Final result: {len(optimized_ipv4)} IPv4 ranges, {len(optimized_ipv6)} IPv6 ranges")

          # Create combined file for dat generation
          with open('russian-ip-combined.txt', 'w') as f:
              for network in optimized_ipv4:
                  f.write(f"{network}\n")
              for network in optimized_ipv6:
                  f.write(f"{network}\n")
          EOF

      - name: Generate statistics
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace
          python3 << 'EOF'
          import ipaddress

          def count_ips_in_file(filename):
              total_ipv4 = 0
              total_ipv6 = 0
              ranges = 0

              with open(filename, 'r') as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          try:
                              network = ipaddress.ip_network(line)
                              ranges += 1
                              if network.version == 4:
                                  total_ipv4 += network.num_addresses
                              else:
                                  total_ipv6 += network.num_addresses
                          except:
                              pass

              return ranges, total_ipv4, total_ipv6

          ranges, ipv4_count, ipv6_count = count_ips_in_file('russian-ip-combined.txt')

          stats = f"""# Russian GeoIP Statistics

          Generated on: $(date)

          ## Summary
          - Total IP ranges: {ranges:,}
          - IPv4 addresses: {ipv4_count:,}
          - IPv6 addresses: {ipv6_count:,}

          ## Sources
          - MaxMind GeoLite2 Country Database

          ## Usage
          This file contains IP ranges assigned to Russia and can be used with:
          - V2Ray/Xray (geoip:ru)
          - Clash (GEOIP,RU)
          - Other proxy tools supporting GeoIP
          """

          with open('RUSSIAN_GEOIP_README.md', 'w') as f:
              f.write(stats)

          print(f"Statistics: {ranges} ranges, {ipv4_count:,} IPv4, {ipv6_count:,} IPv6")
          EOF

      - name: Prepare custom range files
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          rm -rf workspace/custom-ranges
          cp -R custom-ranges workspace/custom-ranges

      - name: Generate GeoIP tool configuration
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace
          python3 << 'EOF'
          import json
          import pathlib

          inputs = [
              {
                  "type": "text",
                  "action": "add",
                  "args": {
                      "name": "ru",
                      "uri": "russian-ip-combined.txt"
                  }
              }
          ]

          for path in sorted(pathlib.Path("custom-ranges").glob("*.txt")):
              name = path.stem.replace('-ranges', '')
              inputs.append(
                  {
                      "type": "text",
                      "action": "add",
                      "args": {
                          "name": name,
                          "uri": str(path)
                      }
                  }
              )

          config = {
              "input": inputs,
              "output": [
                  {
                      "type": "v2rayGeoIPDat",
                      "action": "output",
                      "args": {
                          "outputDir": "output",
                          "outputName": "geoip.dat"
                      }
                  }
              ]
          }

          pathlib.Path("geoip-config.json").write_text(json.dumps(config, indent=2))
          EOF

      - name: Download and setup geoip generation tools
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace
          # Download the geoip generation tool
          git clone https://github.com/Loyalsoldier/geoip.git geoip-tool

      - name: Generate Russian GeoIP dat file
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace/geoip-tool
          mkdir -p ../output
          go mod tidy
          go run ./ convert --config=../geoip-config.json

      - name: Create release files
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd workspace
          mkdir -p ../publish

          # Copy generated files
          cp output/geoip.dat ../publish/
          cp russian-ipv4-final.txt ../publish/
          cp russian-ipv6-final.txt ../publish/
          cp russian-ip-combined.txt ../publish/
          for file in custom-ranges/*.txt; do
            cp "$file" ../publish/$(basename "$file")
          done
          cp RUSSIAN_GEOIP_README.md ../publish/

          # Generate checksums
          cd ../publish
          sha256sum *.dat *.txt > checksums.sha256

          # Create zip archive
          zip -r russian-geoip-$(date +%Y%m%d).zip *.dat *.txt *.md checksums.sha256

      - name: Upload artifacts
        if: steps.check-update.outputs.release_exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: geoip-${{ env.TAG_NAME }}
          path: publish/*

      - name: Create Release
        if: steps.check-update.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            # GeoIP Data Release

            Automatically generated Russian IP address ranges for proxy routing.

            ## Files included:
            - `geoip.dat` - Binary dat file for V2Ray/Xray (includes ru, private, telegram, facebook)
            - `russian-ipv4-final.txt` - Russian IPv4 ranges in CIDR format
            - `russian-ipv6-final.txt` - Russian IPv6 ranges in CIDR format
            - `russian-ip-combined.txt` - Combined Russian IPv4/IPv6 ranges
            - `private-ranges.txt` - Bogon IP ranges
            - `telegram-ranges.txt` - Telegram IP ranges
            - `facebook-ranges.txt` - Facebook/Meta IP ranges
            - `RUSSIAN_GEOIP_README.md` - Statistics and usage info
            - `checksums.sha256` - File checksums

            ## Usage with V2Ray/Xray:
            ```json
            {
              "type": "field",
              "outboundTag": "direct",
              "ip": ["geoip:ru", "geoip:private"]
            },
            {
              "type": "field",
              "outboundTag": "proxy",
              "ip": ["geoip:telegram", "geoip:facebook"]
            }
            ```

            Generated from the MaxMind GeoLite2 Country dataset on $(date).
          files: publish/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git for branch push
        if: steps.check-update.outputs.release_exists == 'false'
        run: |
          cd publish
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release